<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <title>Phí Vận Chuyển - Admin Panel</title>
</head>
<body>
<div layout:fragment="content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="font-size: 20px; font-weight: 800; color: #0f172a;">Cấu Hình Phí Vận Chuyển Theo Khu Vực</h2>
    </div>

    <div class="admin-card">
        <div class="admin-card-header">
            <div class="admin-card-title">
                <i class="fa fa-truck" style="color: #6366f1;"></i>
                Danh Sách Vùng Vận Chuyển &amp; Biểu Phí
            </div>
        </div>
        <div class="admin-card-body" style="padding: 0;">
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>Tên Khu Vực</th>
                        <th>Phí Chuẩn</th>
                        <th>Phí Hỏa Tốc</th>
                        <th>Miễn Phí Từ Đơn</th>
                        <th>Thời Gian Dự Kiến</th>
                        <th>Trạng Thái</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="z : ${zones}">
                        <td style="font-weight: 700; color: #0f172a;" th:text="${z.zoneName}">Nội thành Hà Nội / TP.HCM</td>
                        <td style="font-weight: 600;" th:text="${#numbers.formatDecimal(z.baseFee, 0, 'POINT', 0, 'COMMA')} + ' ₫'">30.000 ₫</td>
                        <td style="font-weight: 600; color: #f59e0b;" th:text="${z.expressFee != null ? #numbers.formatDecimal(z.expressFee, 0, 'POINT', 0, 'COMMA') + ' ₫' : '-'}">60.000 ₫</td>
                        <td style="color: #10b981; font-weight: 600;" th:text="${z.freeShippingThreshold != null ? #numbers.formatDecimal(z.freeShippingThreshold, 0, 'POINT', 0, 'COMMA') + ' ₫' : 'Không'}">1.000.000 ₫</td>
                        <td th:text="${z.estimatedDays != null ? z.estimatedDays + ' ngày' : '1-2 ngày'}">1-2 ngày</td>
                        <td>
                            <span class="status-badge" th:classappend="${z.isActive != null and z.isActive ? 'badge-completed' : 'badge-cancelled'}"
                                  th:text="${z.isActive != null and z.isActive ? 'Hoạt động' : 'Tạm dừng'}">Hoạt động</span>
                        </td>
                    </tr>
                    <tr th:if="${zones == null or zones.isEmpty()}">
                        <td colspan="6" style="text-align: center; color: #94a3b8; padding: 24px;">Chưa có cấu hình vùng vận chuyển</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
