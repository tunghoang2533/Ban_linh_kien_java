<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <title>Quản Lý Người Dùng - Admin Panel</title>
</head>
<body>
<div layout:fragment="content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="font-size: 20px; font-weight: 800; color: #0f172a;">Quản Lý Người Dùng</h2>
    </div>

    <div class="admin-card">
        <div class="admin-card-header">
            <div class="admin-card-title">
                <i class="fa fa-users" style="color: #6366f1;"></i>
                Danh Sách Khách Hàng &amp; Tài Khoản
            </div>
            <form th:action="@{/admin/users}" method="get" style="display: flex; gap: 8px;">
                <input type="text" name="search" th:value="${search}" placeholder="Tìm theo tên/email..." class="form-control" style="width: 220px; padding: 6px 12px; font-size: 13px;">
                <button type="submit" class="btn btn-primary btn-sm"><i class="fa fa-search"></i> Tìm</button>
            </form>
        </div>
        <div class="admin-card-body" style="padding: 0;">
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Khách Hàng</th>
                        <th>Email / Số ĐT</th>
                        <th>Vai Trò</th>
                        <th>Trạng Thái</th>
                        <th>Ngày Tạo</th>
                        <th style="text-align: right;">Hành Động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${users.content}">
                        <td th:text="'#' + ${u.id}" style="font-weight: 700;">#1</td>
                        <td>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <div style="width: 32px; height: 32px; border-radius: 50%; background: #ede9fe; color: #4f46e5; display: flex; align-items: center; justify-content: center; font-weight: 700;"
                                     th:text="${u.fullName != null and !u.fullName.isEmpty() ? #strings.substring(u.fullName, 0, 1) : (u.username != null ? #strings.substring(u.username, 0, 1) : 'U')}">U</div>
                                <div>
                                    <div style="font-weight: 600; color: #0f172a;" th:text="${u.fullName != null ? u.fullName : u.username}">Nguyen Van A</div>
                                    <div style="font-size: 12px; color: #64748b;" th:text="'@' + ${u.username}">@admin</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div th:text="${u.email}">email@example.com</div>
                            <div style="font-size: 12px; color: #64748b;" th:text="${u.phone}">0987654321</div>
                        </td>
                        <td>
                            <span class="status-badge" th:classappend="${u.isAdmin != null and u.isAdmin ? 'badge-processing' : 'badge-completed'}" th:text="${u.role != null ? u.role : 'USER'}">USER</span>
                        </td>
                        <td>
                            <span class="status-badge" th:classappend="${u.isActive != null and u.isActive ? 'badge-completed' : 'badge-cancelled'}"
                                  th:text="${u.isActive != null and u.isActive ? 'Hoạt động' : 'Đã khóa'}">Hoạt động</span>
                        </td>
                        <td th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'dd/MM/yyyy HH:mm') : '-'}">25/09/2026</td>
                        <td style="text-align: right;">
                            <form th:action="@{'/admin/users/' + ${u.id} + '/toggle-status'}" method="post" style="display: inline-block;">
                                <button type="submit" class="btn btn-secondary btn-sm" th:title="${u.isActive != null and u.isActive ? 'Khóa tài khoản' : 'Mở khóa'}">
                                    <i class="fa" th:classappend="${u.isActive != null and u.isActive ? 'fa-lock' : 'fa-unlock'}" th:style="${u.isActive != null and u.isActive ? 'color: #ef4444;' : 'color: #10b981;'}"></i>
                                    <span th:text="${u.isActive != null and u.isActive ? 'Khóa' : 'Mở'}">Khóa</span>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${users.content.isEmpty()}">
                        <td colspan="7" style="text-align: center; color: #94a3b8; padding: 24px;">Không tìm thấy người dùng phù hợp</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
