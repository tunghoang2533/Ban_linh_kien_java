<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <title>Đổi Mật Khẩu - Admin Panel</title>
</head>
<body>
<div layout:fragment="content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="font-size: 20px; font-weight: 800; color: #0f172a;">Đổi Mật Khẩu Quản Trị Viên</h2>
    </div>

    <div class="admin-card" style="max-width: 600px;">
        <div class="admin-card-header">
            <div class="admin-card-title">
                <i class="fa fa-key" style="color: #6366f1;"></i>
                Cập Nhật Mật Khẩu Bảo Mật
            </div>
        </div>
        <div class="admin-card-body">
            <form th:action="@{/admin/change-password}" method="post">
                <div class="form-group">
                    <label class="form-label">Mật Khẩu Hiện Tại</label>
                    <input type="password" name="currentPassword" required class="form-control" placeholder="Nhập mật khẩu hiện tại...">
                </div>
                <div class="form-group">
                    <label class="form-label">Mật Khẩu Mới</label>
                    <input type="password" name="newPassword" required minlength="6" class="form-control" placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)...">
                </div>
                <div class="form-group">
                    <label class="form-label">Xác Nhận Mật Khẩu Mới</label>
                    <input type="password" name="confirmPassword" required class="form-control" placeholder="Nhập lại mật khẩu mới...">
                </div>

                <div style="margin-top: 24px;">
                    <button type="submit" class="btn btn-primary"><i class="fa fa-shield"></i> Cập Nhật Mật Khẩu</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
