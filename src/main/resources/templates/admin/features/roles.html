<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <title>Phân Quyền Admin - Admin Panel</title>
</head>
<body>
<div layout:fragment="content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="font-size: 20px; font-weight: 800; color: #0f172a;">Phân Quyền &amp; Quản Trị Viên</h2>
    </div>

    <div class="admin-card">
        <div class="admin-card-header">
            <div class="admin-card-title">
                <i class="fa fa-user-circle-o" style="color: #6366f1;"></i>
                Danh Sách Quản Trị Viên &amp; Nhân Viên Hệ Thống
            </div>
        </div>
        <div class="admin-card-body" style="padding: 0;">
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên Quản Trị</th>
                        <th>Email</th>
                        <th>Vai Trò Quyền Hạn</th>
                        <th>Lần Đăng Nhập Cuối</th>
                        <th>Trạng Thái</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${admins}">
                        <td th:text="'#' + ${a.id}" style="font-weight: 700;">#1</td>
                        <td>
                            <div style="font-weight: 600; color: #0f172a;" th:text="${a.fullName != null ? a.fullName : a.username}">Admin User</div>
                            <div style="font-size: 12px; color: #64748b;" th:text="'@' + ${a.username}">@admin</div>
                        </td>
                        <td th:text="${a.email}">admin@gmail.com</td>
                        <td><span class="status-badge badge-processing">Toàn Quyền Quản Trị (Super Admin)</span></td>
                        <td style="font-size: 12px; color: #64748b;">Hôm nay, 10:00</td>
                        <td><span class="status-badge badge-completed">Hoạt động</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
