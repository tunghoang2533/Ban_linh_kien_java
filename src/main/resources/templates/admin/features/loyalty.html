<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <title>Tích Điểm Khách Hàng - Admin Panel</title>
</head>
<body>
<div layout:fragment="content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="font-size: 20px; font-weight: 800; color: #0f172a;">Quản Lý Tích Điểm Khách Hàng</h2>
    </div>

    <div class="admin-card">
        <div class="admin-card-header">
            <div class="admin-card-title">
                <i class="fa fa-star" style="color: #f59e0b;"></i>
                Điểm Thưởng &amp; Hạng Thành Viên
            </div>
        </div>
        <div class="admin-card-body" style="padding: 0;">
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>Khách Hàng</th>
                        <th>Email / Điện Thoại</th>
                        <th>Điểm Tích Lũy</th>
                        <th>Điểm Khả Dụng</th>
                        <th>Hạng Hội Viên</th>
                        <th style="text-align: right;">Thao Tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${users}">
                        <td>
                            <div style="font-weight: 600; color: #0f172a;" th:text="${u.fullName != null ? u.fullName : u.username}">Nguyen Van A</div>
                            <div style="font-size: 12px; color: #64748b;" th:text="'#' + ${u.id}">#1</div>
                        </td>
                        <td>
                            <div th:text="${u.email}">email@example.com</div>
                            <div style="font-size: 12px; color: #64748b;" th:text="${u.phone}">0987654321</div>
                        </td>
                        <td style="font-weight: 700; color: #6366f1;">1.250 pts</td>
                        <td style="font-weight: 700; color: #10b981;">1.250 pts</td>
                        <td>
                            <span class="status-badge badge-processing">VIP Bạc</span>
                        </td>
                        <td style="text-align: right;">
                            <button class="btn btn-secondary btn-sm" onclick="alert('Đã mở cửa sổ cộng/trừ điểm')">
                                <i class="fa fa-plus-circle" style="color: #6366f1;"></i> Cộng điểm
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
