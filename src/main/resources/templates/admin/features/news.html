<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <title>Quản Lý Tin Tức - Admin Panel</title>
</head>
<body>
<div layout:fragment="content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="font-size: 20px; font-weight: 800; color: #0f172a;">Quản Lý Bài Viết &amp; Tin Tức</h2>
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('modalAddNews').style.display='flex'"><i class="fa fa-plus"></i> Viết Bài Mới</button>
    </div>

    <div th:if="${successMessage}" class="admin-alert alert-success" style="background:#dcfce7; color:#15803d; padding:12px 16px; border-radius:8px; margin-bottom:16px;">
        <i class="fa fa-check-circle"></i> <span th:text="${successMessage}"></span>
    </div>

    <div class="admin-card">
        <div class="admin-card-header">
            <div class="admin-card-title">
                <i class="fa fa-newspaper-o" style="color: #2563eb;"></i>
                Danh Sách Bài Viết Công Nghệ
            </div>
        </div>
        <div class="admin-card-body" style="padding: 0;">
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th style="width: 70px;">Ảnh</th>
                        <th>Tiêu Đề Bài Viết</th>
                        <th>Đường Dẫn (Slug)</th>
                        <th>Ngày Đăng</th>
                        <th>Trạng Thái</th>
                        <th style="text-align: right;">Thao Tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${articles == null or articles.isEmpty()}">
                        <td colspan="6" style="text-align: center; color: #94a3b8; padding: 24px;">Chưa có bài viết nào trong hệ thống.</td>
                    </tr>
                    <tr th:each="art : ${articles}">
                        <td>
                            <img th:src="${art.thumbnail != null ? art.thumbnail : '/img/tintuc/tintuc1.png'}" style="width: 50px; height: 38px; border-radius: 6px; object-fit: cover;" onerror="this.src='/img/tintuc/tintuc1.png'">
                        </td>
                        <td style="font-weight: 700; color: #0f172a; max-width: 300px;">
                            <a th:href="@{/tin-tuc/{slug}(slug=${art.slug != null ? art.slug : art.id})}" target="_blank" style="color: inherit; text-decoration: none;" th:text="${art.title}">Tiêu đề bài viết</a>
                        </td>
                        <td style="color: #64748b; font-size: 12.5px;" th:text="${art.slug}">slug-bai-viet</td>
                        <td style="color: #64748b; font-size: 12.5px;" th:text="${art.publishedAt != null ? #temporals.format(art.publishedAt, 'dd/MM/yyyy HH:mm') : '-'}">20/09/2026</td>
                        <td>
                            <span class="status-badge badge-completed" th:if="${art.isPublished}">Hiển thị</span>
                            <span class="status-badge badge-canceled" th:unless="${art.isPublished}">Ẩn</span>
                        </td>
                        <td style="text-align: right;">
                            <form th:action="@{/admin/news/{id}/delete(id=${art.id})}" method="post" style="display:inline;" onsubmit="return confirm('Bạn có chắc chắn muốn xóa bài viết này?')">
                                <button type="submit" class="btn btn-sm" style="background:#fee2e2; color:#ef4444; border:none; padding: 4px 8px; border-radius: 6px; cursor: pointer;" title="Xóa"><i class="fa fa-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Viết bài mới -->
    <div id="modalAddNews" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1050; align-items: center; justify-content: center;">
        <div style="background: #fff; width: 90%; max-width: 650px; border-radius: 12px; padding: 24px; max-height: 90vh; overflow-y: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="font-size: 18px; font-weight: 700; margin: 0;">Thêm Bài Viết Mới</h3>
                <button type="button" onclick="document.getElementById('modalAddNews').style.display='none'" style="border:none; background:none; font-size:20px; cursor:pointer;">&times;</button>
            </div>
            <form th:action="@{/admin/news/save}" method="post">
                <div style="margin-bottom: 12px;">
                    <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">Tiêu đề bài viết:</label>
                    <input type="text" name="title" required class="form-control" style="width:100%; padding:8px 12px; border:1px solid #cbd5e1; border-radius:6px;" placeholder="Nhập tiêu đề...">
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">Đường dẫn (Slug - để trống tự tạo):</label>
                    <input type="text" name="slug" class="form-control" style="width:100%; padding:8px 12px; border:1px solid #cbd5e1; border-radius:6px;" placeholder="danh-gia-linh-kien...">
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">Link ảnh Thumbnail:</label>
                    <input type="text" name="thumbnail" value="/img/tintuc/tintuc1.png" class="form-control" style="width:100%; padding:8px 12px; border:1px solid #cbd5e1; border-radius:6px;">
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">Tóm tắt ngắn (Summary):</label>
                    <textarea name="summary" rows="2" class="form-control" style="width:100%; padding:8px 12px; border:1px solid #cbd5e1; border-radius:6px;" placeholder="Đoạn tóm tắt mở đầu..."></textarea>
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">Nội dung bài viết (HTML / Text):</label>
                    <textarea name="content" rows="6" class="form-control" style="width:100%; padding:8px 12px; border:1px solid #cbd5e1; border-radius:6px;" placeholder="<p>Nội dung chi tiết...</p>"></textarea>
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="font-size:13px; font-weight:600;">
                        <input type="checkbox" name="isPublished" value="true" checked> Xuất bản ngay
                    </label>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px;">
                    <button type="button" onclick="document.getElementById('modalAddNews').style.display='none'" class="btn" style="background:#f1f5f9; color:#475569; padding:8px 16px; border-radius:6px; border:none; cursor:pointer;">Hủy</button>
                    <button type="submit" class="btn btn-primary" style="padding:8px 20px;">Lưu Bài Viết</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
