<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <title>Quản Lý Danh Mục - Quản Trị</title>
</head>
<body>

<div layout:fragment="content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="font-size: 20px; font-weight: 800;">Quản Lý Danh Mục &amp; Nhãn Hàng</h2>
        <div style="display: flex; gap: 8px;">
            <a th:href="@{/admin/categories}" class="btn btn-primary btn-sm"><i class="fa fa-tags"></i> Danh Mục</a>
            <a th:href="@{/admin/brands}" class="btn btn-secondary btn-sm"><i class="fa fa-trademark"></i> Nhãn Hàng (Thương Hiệu)</a>
        </div>
    </div>


    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 24px;">
        <!-- Left: Form -->
        <div class="admin-card">
            <div class="admin-card-header">
                <div class="admin-card-title">
                    <i class="fa fa-plus-circle" style="color: #2563eb;"></i>
                    <span id="formTitle">Thêm Danh Mục Mới</span>
                </div>
            </div>
            <div class="admin-card-body">
                <form th:action="@{/admin/categories/save}" method="post">
                    <input type="hidden" id="categoryId" name="id">

                    <div class="form-group">
                        <label class="form-label">Tên danh mục <span style="color: #ef4444;">*</span></label>
                        <input type="text" id="categoryName" name="name" class="form-control"
                               placeholder="Ví dụ: CPU - Bộ vi xử lý" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Đường dẫn tĩnh (Slug)</label>
                        <input type="text" id="categorySlug" name="slug" class="form-control"
                               placeholder="Tự động tạo nếu để trống (e.g. cpu-bo-vi-xu-ly)">
                    </div>

                    <div style="display: flex; gap: 8px;">
                        <button type="submit" class="btn btn-primary" style="flex: 1; justify-content: center;">
                            <i class="fa fa-save"></i> Lưu Danh Mục
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="resetCategoryForm()">
                            Hủy
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Right: Table -->
        <div class="admin-card">
            <div class="admin-card-header">
                <div class="admin-card-title">
                    <i class="fa fa-list" style="color: #10b981;"></i> Danh Sách Danh Mục Hiện Có
                </div>
            </div>
            <div class="admin-card-body" style="padding: 0;">
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                        <tr>
                            <th style="width: 70px;">ID</th>
                            <th>Tên danh mục</th>
                            <th>Đường dẫn tĩnh (Slug)</th>
                            <th style="text-align: right; width: 120px;">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${categories}">
                            <td style="font-weight: 700; color: #64748b;" th:text="'#' + ${c.id}">#1</td>
                            <td style="font-weight: 600; color: #0f172a;" th:text="${c.name}">CPU</td>
                            <td style="font-family: monospace; color: #64748b;" th:text="${c.slug}">cpu</td>
                            <td style="text-align: right;">
                                <div style="display: inline-flex; gap: 6px;">
                                    <button type="button" class="btn btn-secondary btn-sm"
                                            th:data-id="${c.id}"
                                            th:data-name="${c.name}"
                                            th:data-slug="${c.slug}"
                                            onclick="editCategory(this)" title="Chỉnh sửa">
                                        <i class="fa fa-pencil"></i>
                                    </button>
                                    <form th:action="@{'/admin/categories/' + ${c.id} + '/delete'}" method="post"
                                          onsubmit="return confirm('Bạn có chắc muốn xóa danh mục này?');">
                                        <button type="submit" class="btn btn-danger btn-sm" title="Xóa">
                                            <i class="fa fa-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${categories == null or categories.isEmpty()}">
                            <td colspan="4" style="text-align: center; color: #94a3b8; padding: 24px;">Chưa có danh mục nào.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script>
        function editCategory(btn) {
            document.getElementById('formTitle').innerText = 'Chỉnh Sửa Danh Mục #' + btn.getAttribute('data-id');
            document.getElementById('categoryId').value = btn.getAttribute('data-id');
            document.getElementById('categoryName').value = btn.getAttribute('data-name');
            document.getElementById('categorySlug').value = btn.getAttribute('data-slug');
        }

        function resetCategoryForm() {
            document.getElementById('formTitle').innerText = 'Thêm Danh Mục Mới';
            document.getElementById('categoryId').value = '';
            document.getElementById('categoryName').value = '';
            document.getElementById('categorySlug').value = '';
        }
    </script>
</th:block>

</body>
</html>
