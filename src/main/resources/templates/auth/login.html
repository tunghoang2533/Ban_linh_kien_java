<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/storefront}">
<head>
    <title>Đăng Nhập - Bán Linh Kiện</title>
    <style>
        .auth-page {
            min-height: calc(100vh - 360px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 16px;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
            padding: 40px 36px;
            border: 1px solid #e2e8f0;
        }
        .auth-card h1 {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            margin: 0 0 8px;
            text-align: center;
        }
        .auth-subtitle {
            font-size: 14px;
            color: #64748b;
            text-align: center;
            margin-bottom: 28px;
        }
        .auth-field {
            margin-bottom: 20px;
        }
        .auth-field label {
            display: block;
            font-size: 13.5px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
        }
        .auth-field input {
            width: 100%;
            height: 46px;
            padding: 0 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .auth-field input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .btn-submit-auth {
            width: 100%;
            height: 48px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-submit-auth:hover {
            background: #1d4ed8;
        }
        .auth-footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13.5px;
            color: #64748b;
        }
        .auth-footer-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div layout:fragment="content" class="auth-page">
    <div class="auth-card">
        <h1>Đăng Nhập Tài Khoản</h1>
        <div class="auth-subtitle">Nhập thông tin tài khoản của bạn để tiếp tục</div>

        <!-- Flash alerts -->
        <div th:if="${errorMessage != null}" class="alert-box alert-error" style="margin-bottom: 20px;" th:text="${errorMessage}"></div>
        <div th:if="${successMessage != null}" class="alert-box alert-success" style="margin-bottom: 20px;" th:text="${successMessage}"></div>

        <form th:action="@{/login}" method="post">
            <div class="auth-field">
                <label for="username">Tên đăng nhập hoặc Email</label>
                <input type="text" id="username" name="username" required autofocus placeholder="ví dụ: nguyenvana hoặc email">
            </div>

            <div class="auth-field">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" required placeholder="Nhập mật khẩu của bạn">
            </div>

            <button type="submit" class="btn-submit-auth">
                <i class="fa fa-sign-in"></i> Đăng Nhập
            </button>
        </form>

        <div class="auth-footer-link">
            Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a>
        </div>
    </div>
</div>
</body>
</html>
