<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/storefront}">
<head>
    <title>Danh Sách Linh Kiện - Bán Linh Kiện</title>
    <style>
        .catalog-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 32px;
            margin: 32px 0 60px;
        }
        .filter-sidebar {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 24px 20px;
            height: fit-content;
        }
        .filter-title {
            font-size: 16px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .category-filter-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .category-filter-list li { margin-bottom: 6px; }
        .category-filter-list a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            color: #475569;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .category-filter-list a:hover,
        .category-filter-list a.active {
            background: #eff6ff;
            color: #2563eb;
            font-weight: 700;
        }

        /* Products list main area */
        .catalog-main {}
        .catalog-toolbar {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .catalog-results-count {
            font-size: 14px;
            color: #64748b;
        }
        .catalog-results-count strong { color: #0f172a; }

        /* Pagination */
        .pagination-wrap {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 40px;
        }
        .pagination-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 38px;
            height: 38px;
            padding: 0 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .pagination-btn:hover {
            border-color: #2563eb;
            color: #2563eb;
        }
        .pagination-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }
    </style>
</head>
<body>
<div layout:fragment="content" class="container">

    <div class="catalog-layout">
        <!-- Sidebar Filter -->
        <aside class="filter-sidebar">
            <div class="filter-title"><i class="fa fa-filter" style="color: #2563eb;"></i> Danh Mục Linh Kiện</div>
            <ul class="category-filter-list">
                <li>
                    <a th:href="@{/san-pham}" th:classappend="${selectedCategoryId == null ? 'active' : ''}">
                        <span>Tất cả linh kiện</span>
                    </a>
                </li>
                <li th:each="cat : ${categories}">
                    <a th:href="@{'/danh-muc/' + ${cat.id}}"
                       th:classappend="${selectedCategoryId != null and selectedCategoryId == cat.id ? 'active' : ''}">
                        <span th:text="${cat.name}">Category Name</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Product Grid -->
        <div class="catalog-main">
            <div class="catalog-toolbar">
                <div class="catalog-results-count">
                    Tìm thấy <strong th:text="${totalElements}">0</strong> sản phẩm linh kiện
                    <span th:if="${search != null and !search.isEmpty()}"> cho từ khóa: "<strong th:text="${search}"></strong>"</span>
                </div>
            </div>

            <div class="product-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px;">
                <div class="product-card" th:each="product : ${products}" style="background: #fff; border-radius: 14px; border: 1px solid #e2e8f0; padding: 16px; display: flex; flex-direction: column;">
                    <div class="product-badge" th:if="${product.hasDiscount()}" th:text="'-' + ${#numbers.formatDecimal(product.discountPercent, 0, 0)} + '%'">-10%</div>
                    <a th:href="@{'/san-pham/' + ${product.id}}" style="width: 100%; height: 180px; display: flex; align-items: center; justify-content: center; background: #f8fafc; border-radius: 8px; margin-bottom: 12px;">
                        <img th:src="${product.image != null and !product.image.isEmpty() ? (product.image.startsWith('http') ? product.image : (product.image.startsWith('/') ? product.image : '/img/products/' + product.image)) : '/img/products/intel-i5-12400f.png'}" 
                             th:alt="${product.name}"
                             style="max-width: 90%; max-height: 90%; object-fit: contain;"
                             onerror="this.src='/img/products/intel-i5-12400f.png'">
                    </a>
                    <div style="font-size: 11.5px; color: #64748b; font-weight: 600; text-transform: uppercase;" th:text="${product.category != null ? product.category.name : 'Linh kiện'}">Linh kiện</div>
                    <a th:href="@{'/san-pham/' + ${product.id}}" style="font-size: 14px; font-weight: 700; color: #0f172a; text-decoration: none; height: 38px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 8px;" th:text="${product.name}">Tên sản phẩm</a>
                    <div style="margin-top: auto; display: flex; align-items: baseline; gap: 8px;">
                        <div style="font-size: 16px; font-weight: 800; color: #dc2626;" th:text="${#numbers.formatDecimal(product.getFinalPrice(), 0, 'POINT', 0, 'COMMA')} + ' ₫'">0 ₫</div>
                        <div style="font-size: 12px; color: #94a3b8; text-decoration: line-through;" th:if="${product.hasDiscount()}" th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA')} + ' ₫'">0 ₫</div>
                    </div>
                </div>
            </div>

            <!-- Empty state -->
            <div th:if="${#lists.isEmpty(products)}" style="text-align: center; padding: 60px 20px; background: #fff; border-radius: 12px; border: 1px solid #e2e8f0;">
                <i class="fa fa-search" style="font-size: 48px; color: #cbd5e1; margin-bottom: 16px;"></i>
                <h3 style="font-size: 18px; color: #334155; margin-bottom: 8px;">Không tìm thấy sản phẩm phù hợp</h3>
                <p style="color: #64748b; font-size: 14px;">Vui lòng thử tìm kiếm bằng từ khóa khác hoặc quay lại danh mục đầy đủ.</p>
                <a th:href="@{/san-pham}" style="display: inline-block; margin-top: 12px; color: #2563eb; font-weight: 600;">Xem tất cả sản phẩm &rarr;</a>
            </div>

            <!-- Pagination -->
            <div class="pagination-wrap" th:if="${totalPages > 1}">
                <a th:if="${currentPage > 0}" 
                   th:href="@{/san-pham(page=${currentPage - 1}, search=${search}, category_id=${selectedCategoryId})}"
                   class="pagination-btn"><i class="fa fa-chevron-left"></i></a>
                
                <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:href="@{/san-pham(page=${i}, search=${search}, category_id=${selectedCategoryId})}"
                       th:text="${i + 1}"
                       th:classappend="${currentPage == i ? 'active' : ''}"
                       class="pagination-btn">1</a>
                </th:block>

                <a th:if="${currentPage < totalPages - 1}"
                   th:href="@{/san-pham(page=${currentPage + 1}, search=${search}, category_id=${selectedCategoryId})}"
                   class="pagination-btn"><i class="fa fa-chevron-right"></i></a>
            </div>
        </div>
    </div>

</div>
</body>
</html>
